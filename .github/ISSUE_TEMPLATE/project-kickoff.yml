name: Project Kickoff
description: Start a new project. Submitting this automatically hands it to the Product Manager.
title: "Project Kickoff: "
labels: ["agent:product-manager"]
body:
  - type: markdown
    attributes:
      value: |
        A short brief is enough — the Product Manager will interview
        you for everything else through its own process. You don't need
        to explain what it should do; that's already defined in its
        role file and happens automatically once this issue is
        submitted.
  - type: textarea
    id: brief
    attributes:
      label: What are we building?
      description: >-
        Mention anything you already know for certain — target
        platform, language, must-have tools — so it's captured as
        confirmed rather than asked about. Everything else can be left
        for the interview.
      placeholder: |
        Build a command-line tool in C# that reads a config file and
        emulates a PLC scan cycle. Windows and Linux both matter.
        (Leave IDE and target-verification choices for the interview
        unless one is a genuine hard constraint.)
    validations:
      required: true
