name: agent-relay
#
# GITHUB-HOSTED UBUNTU (2026-09-05, same configuration as NAADAP): runs on
# ubuntu-latest. This repo is PUBLIC, where hosted standard runners are
# free and unlimited, so the "minutes exhausted" constraint that pushed
# the template's other projects onto self-hosted listeners does not apply.
#
# WHY NOT SELF-HOSTED HERE: inherited from the template as
# `runs-on: [self-hosted, agents]`, which could never schedule on this
# repo. GitHub refuses self-hosted runners for PUBLIC repositories unless
# the runner group opts in, and HoloSim-Interactive's Default group has
# allows_public_repositories: false -- so the kickoff's first two relay
# runs (33946697125, 33947045861) sat queued indefinitely rather than
# failing, because a never-matched runs-on never errors. Claude Code is
# installed by the action itself on Linux -- path_to_claude_code_executable
# must stay absent, since the template's Windows path does not exist on a
# GitHub VM.

# Fires whenever an "agent:*" label lands on an issue. Label changes
# are the sole trigger -- comments never trigger anything, by design.
# See .github/AGENT_LABELS.md for the label convention this workflow
# depends on.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

# Per issue AND per event class (NAADAP fix, 2026-09-03). GitHub gives no
# label filter for `issues: labeled`, so EVERY label edit creates a
# workflow run -- including the status:* edits the relay and its agents
# make on themselves. Those runs are no-ops, skipped by the job's `if:`
# below. But a run enters its concurrency group BEFORE the job-level `if:`
# is evaluated, and GitHub keeps only ONE pending run per group: a newer
# pending run cancels an older one. So a no-op status run registering just
# after a real agent:* pickup can cancel that pickup before any job is
# created -- no job, no log, no failure, and the hand-off silently did not
# happen. Seen on two projects built from this template (NAADAP issue #6;
# a lost CI/CD merge on Drone_Tracks issue #10) before this was written.
#
# "Add the agent label last" is necessary but NOT sufficient: the order
# two same-second events REGISTER in is not guaranteed to match the order
# the labels were applied. Splitting the group is what actually fixes it.
#
# Pickups keep a per-issue group, so two agents can still never run on one
# issue at once -- the property the original group existed to provide.
#
# No-op runs get a group unique per run (github.run_id) rather than a
# shared "-status" group. A shared one is correct but noisy: the no-ops
# cancel each other, and a run list full of "cancelled" entries is
# indistinguishable at a glance from lost work. With a unique group each
# no-op simply skips, so "cancelled" goes back to meaning something
# actually went wrong. A skipped job never dispatches a runner, so this
# costs nothing.
concurrency:
  group: ${{ startsWith(github.event.label.name, 'agent:') && format('agent-relay-{0}-pickup', github.event.issue.number) || format('agent-relay-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  relay:
    if: startsWith(github.event.label.name, 'agent:')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # 90, not 30 (2026-08-26): Generate Code Base on this project hit the
    # five-hour usage window at 5:35am ET, Claude Code WAITED for the reset
    # rather than exiting, and the 30-minute ceiling killed the job as
    # "cancelled" -- which skipped the failure classifier below entirely
    # (see its if: for the companion fix). A big scaffolding or feature
    # task can also legitimately need more than 30 minutes. One agents
    # runner serves this repo, so a long turn queues everything behind it;
    # 90 keeps a wedged run from monopolizing the runner for hours while
    # still giving real work room to finish.
    # 180, raised from 90 (2026-08-28): issue #13's adoption round — nine
    # confirmed clauses implemented plus a full re-measurement — was killed
    # by the 90-minute ceiling at 02:19Z mid-measurement. The 90 was chosen
    # when ONE agents runner served the repo and a wedged run monopolized
    # it; with two runners (client's 20X upgrade, 2026-08-27) a long turn
    # costs half the pipeline, not all of it. The failure classifier still
    # catches the timeout-cancel case (see its if: below).
    timeout-minutes: 180
    # RELAY_TOKEN must be a personal access token or GitHub App
    # installation token, NOT the default GITHUB_TOKEN. Labels added
    # using the default token don't fire new workflow runs, which would
    # silently break the handoff to the next role. See setup notes below.
    env:
      GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Determine which role should act
        id: role
        run: |
          ROLE="${{ github.event.label.name }}"
          ROLE="${ROLE#agent:}"
          if [ -z "$ROLE" ]; then
            echo "No agent role matched in this event — nothing to do."
            exit 1
          fi
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"
          echo "issue=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"

      - name: Mark issue in progress
        # GITHUB_TOKEN here, deliberately NOT the job's RELAY_TOKEN (NAADAP
        # fix, 2026-09-03). A label added with the default GITHUB_TOKEN
        # does not trigger a new workflow run -- the same GitHub rule that
        # forces RELAY_TOKEN on the hand-off labels further down, where
        # firing the next run is the whole point. Here it is inverted: this
        # label must NOT fire anything. With RELAY_TOKEN every pickup
        # immediately spawned a second, no-op run that the concurrency-
        # group split above then has to defend against. This is the
        # root-cause half of that fix; both are kept, since agents still
        # apply status:* labels with RELAY_TOKEN from inside Claude Code,
        # so no-op runs have not gone away entirely.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit ${{ steps.role.outputs.issue }} --add-label "status:in-progress" \
            || echo "WARNING: could not set status:in-progress -- the hand-off's tolerant removals will cope, but check RELAY_TOKEN permissions if this recurs."

      - name: Run Claude Code as ${{ steps.role.outputs.role }}
        id: run_claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot]"
          # Full output includes the actual error detail (error/error_type/
          # message) on failure, not just the summary result object -- what
          # we were missing this time. Tradeoff: it also means raw prompts
          # and tool output land in the log, visible to anyone with read
          # access to this repo. Reasonable here; worth reconsidering for
          # anything more sensitive built from this template later.
          show_full_output: "true"
          # Alternative if you'd rather go back to separate API billing,
          # decoupled from your subscription's own usage window:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ steps.role.outputs.issue }}

            You are acting as the ${{ steps.role.outputs.role }} on this
            project. Your responsibilities and communication rules are
            defined in .claude/agents/${{ steps.role.outputs.role }}.md —
            follow them.

            1. Read issue #${{ steps.role.outputs.issue }} in full,
               including every comment, to understand the current state
               of this handoff.
            2. Read .claude/agent-memory/${{ steps.role.outputs.role }}/MEMORY.md
               for anything relevant you've learned on past issues.
               It's an index of one-line summaries — if a line looks
               relevant to this task, open the file it links to for the
               full detail. Don't open files whose summaries don't
               apply; that's the whole point of the index.
            3. If this task touches one of the standard docs
               (docs/PROJECT_DEFINITION.md, docs/RTVM.md, docs/SDD.md,
               docs/IMPLEMENTATION_PLAN.md), check whether it already
               exists before writing to it — every project starts with
               a pre-structured skeleton for these. Fill in that
               existing structure; don't replace it with something new.
            4. Do the work the issue is asking of you.
            5. Post one comment on the issue before you finish — no
               matter what happened. This isn't conditional on
               success: if you completed the task, say what you did;
               if you hit an error, ran out of information you
               couldn't resolve, or got blocked by something outside
               your control, say that instead, as specifically as you
               can. The comment thread should never go quiet with no
               record of what was attempted. Follow the comment
               structure in .github/AGENT_LABELS.md exactly: first
               line lists every intended reader and then identifies
               you, as "<Reader>[, <Reader>...], this is <Your role>:"
               — the "this is" is required, since without it a second
               reader is indistinguishable from the sender. Last line
               is a
               "**Next:**" status line. The Next line isn't
               decoration — stall-recovery.yml parses it to route a
               recovered hand-off correctly, so get the exact format
               right.
            6. Hand off. Run these as SEPARATE commands, in this order —
               not combined into one. A single `gh issue edit` with
               several flags fails as a whole if any one label isn't
               present, which silently skips the hand-off and stalls
               the issue. Independent commands can't do that.

                 # a) clear any pipeline-status label you inherited —
                 #    yours to clean up, or they accumulate across
                 #    every hand-off and contradict each other
                 for L in status:ready-for-test \
                          status:ready-for-rtvm-update \
                          status:ready-for-commit; do
                   gh issue edit ${{ steps.role.outputs.issue }} \
                     --remove-label "$L" 2>/dev/null || true
                 done

                 # b) clear the run flag and your own turn
                 gh issue edit ${{ steps.role.outputs.issue }} \
                   --remove-label "status:in-progress" 2>/dev/null || true
                 gh issue edit ${{ steps.role.outputs.issue }} \
                   --remove-label "agent:${{ steps.role.outputs.role }}" 2>/dev/null || true

                 # c) set the new status, if your role defines one for
                 #    this transition (e.g. status:ready-for-commit)
                 gh issue edit ${{ steps.role.outputs.issue }} \
                   --add-label "status:<new-status>"   # omit if none applies

                 # d) LAST — this is what triggers the next agent, so
                 #    everything else must already be correct
                 gh issue edit ${{ steps.role.outputs.issue }} \
                   --add-label "agent:<next-role>"

               If you're blocked, add "status:blocked" and set the next
               role to agent:solutions-architect instead of the normal
               next step. Exception: if your role's own instructions
               say you're waiting on a human reply rather than handing
               off to another role, follow that instead — just remove
               "status:in-progress" and leave your own agent:* label in
               place, so nothing else gets triggered on this issue
               until they reply.
            7. If you learned something durable — a pattern, a gotcha,
               an architectural decision — record it. If it fits in one
               line, add that line to your MEMORY.md index. If it needs
               real explanation, write a detail file next to MEMORY.md
               and add a one-line summary linking to it. See "Memory
               structure" in .github/AGENT_LABELS.md. Keep MEMORY.md
               itself short — it's loaded on every future run.
          # Model policy. Fable 5 is reserved for the small number of issues
          # whose difficulty is mathematical rather than mechanical, named as
          # a list so the switch is one edit. Currently #53 and #54, the v1.2
          # rung's affine-pose spine and its geometry-under-a-non-orthogonal-
          # map correctness gate (client, 2026-08-30). Precedent below.
          #
          # (client, 2026-08-27/28): Fable 5 was pinned for the
          # correctness core (#11/#12/#13). #11/#12 closed same-day, and one
          # day of all-Fable relay burned 64% of the weekly Fable budget —
          # so Fable is now scoped to #13 alone and every other issue runs
          # Opus, which delivered #5–#15. When #13 closes, remove the
          # conditional entirely (all-Opus) unless the client re-pins.
          claude_args: |
            --agent ${{ steps.role.outputs.role }}
            --permission-mode bypassPermissions
            # --model ${{ contains(fromJSON('[]'), github.event.issue.number) && 'claude-fable-5' || 'claude-opus-5' }}

      - name: Handle known infrastructure failures, or fail normally
        # always() + != 'success', not == 'failure' (2026-08-26): when the
        # job's timeout-minutes killed a rate-limited run that was waiting
        # for its usage-window reset, the step outcome was "cancelled", not
        # "failure" -- so this classifier was SKIPPED, the usage-window
        # branch below never posted its comment or set status:needs-human,
        # and usage-reset-resume (which only un-parks that label) had
        # nothing to act on. The issue sat silently on status:in-progress
        # until stall-recovery's one-hour threshold caught it. always() is
        # required for the step to run at all after a cancellation; the
        # execution-file grep below then classifies the death exactly as it
        # would a failure, since the rate_limit_event is in the log either
        # way.
        if: always() && steps.run_claude.outcome != 'success' && steps.run_claude.outcome != 'skipped'
        run: |
          # A fixed short sleep has now twice come back with an empty or
          # incomplete log, even for a run that clearly produced output --
          # confirmed, not just suspected, given the same pattern recurring.
          # Poll instead of guessing at a duration: retry until the log
          # actually contains Claude Code's own completion marker, or give
          # up after a bounded number of attempts.
          # The remote log API lags badly on this runner: on 2026-08-25
          # exhausted runs polled it for 30s, got an EMPTY log, and every
          # classifier grep ran against nothing -- so the (correct)
          # usage-window classifier below never saw its markers, runs
          # fell through to a bare failure with labels intact, and the
          # hourly sweep re-triggered the same wall all day. Third
          # burn-loop, third distinct cause.
          #
          # The action exposes its execution log as a LOCAL file
          # (outputs.execution_file) -- instant, complete, and contains
          # both the result JSON and the rate_limit_event. Read that
          # first; keep the log-API poll only as a fallback for the
          # case where the action died before writing it.
          RUN_LOG=""
          EXEC_FILE="${{ steps.run_claude.outputs.execution_file }}"
          if [[ -n "$EXEC_FILE" && -f "$EXEC_FILE" ]]; then
            RUN_LOG="$(cat "$EXEC_FILE" 2>/dev/null || true)"
          fi
          if [[ -z "$RUN_LOG" ]]; then
            for attempt in 1 2 3 4 5 6; do
              RUN_LOG="$(gh run view ${{ github.run_id }} --log 2>/dev/null || true)"
              if echo "$RUN_LOG" | grep -q '"type": *"result"'; then
                break
              fi
              sleep 5
            done
          fi

          notify() {
            gh issue comment ${{ steps.role.outputs.issue }} --body "$1"
            gh issue edit ${{ steps.role.outputs.issue }} \
              --remove-label "agent:${{ steps.role.outputs.role }}" \
              --remove-label "status:in-progress" \
              --add-label "status:needs-human"
          }

          if echo "$RUN_LOG" | grep -qi "credit balance is too low"; then
            notify "$(cat <<'EOF'
          **This run could not execute — the Anthropic API reported a credit-balance error.**

          This usually means the account's API credit balance needs
          topping up at console.anthropic.com. It has also been reported
          for unrelated causes (e.g. an orphaned API key, where the
          balance looks fine but the key/workspace link is broken) — if
          the balance already looks fine there, try regenerating
          ANTHROPIC_API_KEY before assuming more funds are needed.

          Once resolved, remove status:needs-human and re-add
          agent:${{ steps.role.outputs.role }} to resume.
          EOF
          )"
            exit 0
          fi

          if echo "$RUN_LOG" | grep -qiE "authentication_error|authentication_failed|API key is invalid"; then
            notify "$(cat <<'EOF'
          **This run could not execute — the Anthropic API rejected the key as invalid.**

          ANTHROPIC_API_KEY is likely missing, mistyped, or revoked.
          Check Settings -> Secrets and variables -> Actions, and confirm
          the key still exists at console.anthropic.com — regenerate it
          if you're unsure.

          Once resolved, remove status:needs-human and re-add
          agent:${{ steps.role.outputs.role }} to resume.
          EOF
          )"
            exit 0
          fi

          if echo "$RUN_LOG" | grep -qi "permission_error"; then
            notify "$(cat <<'EOF'
          **This run could not execute — the API key doesn't have access to the model it tried to use.**

          Check the key's workspace and organization model access at
          console.anthropic.com.

          Once resolved, remove status:needs-human and re-add
          agent:${{ steps.role.outputs.role }} to resume.
          EOF
          )"
            exit 0
          fi

          if echo "$RUN_LOG" | grep -qi "Could not fetch an OIDC token"; then
            notify "$(cat <<'EOF'
          **This run could not execute — GitHub couldn't issue an OIDC token for the workflow.**

          This should already be fixed (id-token: write is set in
          agent-relay.yml's permissions), so seeing it again suggests
          that permission was removed, or this workflow file got copied
          to a new repo without it.

          Once resolved, remove status:needs-human and re-add
          agent:${{ steps.role.outputs.role }} to resume.
          EOF
          )"
            exit 0
          fi

          if echo "$RUN_LOG" | grep -qi "Workflow initiated by non-human actor"; then
            notify "$(cat <<'EOF'
          **This run could not execute — claude-code-action rejected it because a bot, not a human, triggered it.**

          This should already be fixed (allowed_bots: "claude[bot]" is
          set in agent-relay.yml), so seeing it again suggests that
          setting was removed, or this workflow file got copied to a
          new repo without it. This happens whenever an agent's own
          hand-off uses claude-code-action's GitHub App identity rather
          than RELAY_TOKEN to relabel an issue -- a normal, expected
          part of how agents hand off to each other, which is exactly
          why it needs to stay allow-listed rather than fixed by
          changing how agents hand off.

          Once resolved, remove status:needs-human and re-add
          agent:${{ steps.role.outputs.role }} to resume.
          EOF
          )"
            exit 0
          fi

          # 2026-09-03: the API's actual error field is bare "overloaded" (see
          # run 33764510697, issue #30 -- 10x "error_status: 529, error:
          # \"overloaded\"" retries, then is_error:true) -- "overloaded_error"
          # never appears anywhere in a real log, so every genuine overload fell
          # through to the generic unrecognized-error handler below instead of
          # this retry ladder. Matched three issues parked needs-human within
          # 12 minutes of each other, all the same root cause. Keep
          # "overloaded_error" too in case the field shape ever changes back.
          if echo "$RUN_LOG" | grep -qiE 'rate_limit_error|overloaded_error|"error":[[:space:]]*"overloaded"'; then
            if echo "$RUN_LOG" | grep -qi "rate_limit_error"; then
              ERROR_KIND="rate limit"
              ERROR_DESC="The account is sending requests faster than its current usage tier allows — likely several issues running concurrently at once."
            else
              ERROR_KIND="service overload"
              ERROR_DESC="Anthropic's API itself is temporarily overloaded — this is about their service capacity, not this account specifically."
            fi

            CURRENT_LABELS="$(gh issue view ${{ steps.role.outputs.issue }} --json labels -q '.labels[].name')"
            CURRENT_RETRY=0
            echo "$CURRENT_LABELS" | grep -q "^status:retry-1$" && CURRENT_RETRY=1
            echo "$CURRENT_LABELS" | grep -q "^status:retry-2$" && CURRENT_RETRY=2
            echo "$CURRENT_LABELS" | grep -q "^status:retry-3$" && CURRENT_RETRY=3
            NEXT_RETRY=$((CURRENT_RETRY + 1))

            if (( NEXT_RETRY > 3 )); then
              gh issue comment ${{ steps.role.outputs.issue }} --body "$(cat <<EOF
          **Automatic retry is giving up — this run has now failed 3 times in a row with a $ERROR_KIND error.**

          $ERROR_DESC

          Three consecutive failures with the same transient-looking error
          usually means it isn't actually transient. Retrying a 4th time
          automatically is unlikely to help without something changing on
          one end or the other.

          What to check: current usage tier and rate limits at
          console.anthropic.com (Settings -> Limits), and whether several
          other issues are actively running right now and competing for
          the same per-minute request/token budget. If concurrency is the
          cause, this may resolve on its own once other runs finish —
          worth a look before assuming the tier itself needs raising.

          This is now status:needs-human rather than continuing to retry
          silently. Once resolved, remove status:needs-human and
          status:retry-3, and re-add agent:${{ steps.role.outputs.role }}
          to resume.
          EOF
          )"
              gh issue edit ${{ steps.role.outputs.issue }} \
                --remove-label "agent:${{ steps.role.outputs.role }}" \
                --remove-label "status:in-progress" \
                --remove-label "status:retry-3" \
                --add-label "status:needs-human"
              exit 0
            fi

            case $NEXT_RETRY in
              1) DELAY=30 ;;
              2) DELAY=60 ;;
              3) DELAY=120 ;;
            esac

            gh issue comment ${{ steps.role.outputs.issue }} --body "$(cat <<EOF
          **This run hit a $ERROR_KIND error — retrying automatically (attempt $NEXT_RETRY of 3).**

          $ERROR_DESC

          This is expected to resolve on its own, so no action is needed
          unless it keeps happening. Waiting ${DELAY}s before the retry —
          the wait increases each attempt (30s, then 60s, then 120s) to
          give whatever caused this more room to clear. If this is still
          failing after attempt 3, it will stop retrying automatically
          and flag status:needs-human instead of trying indefinitely.
          EOF
          )"

            if (( CURRENT_RETRY > 0 )); then
              gh issue edit ${{ steps.role.outputs.issue }} \
                --remove-label "status:retry-$CURRENT_RETRY" \
                --remove-label "status:in-progress" \
                --add-label "status:retry-$NEXT_RETRY" || true
            else
              gh issue edit ${{ steps.role.outputs.issue }} \
                --remove-label "status:in-progress" \
                --add-label "status:retry-$NEXT_RETRY"
            fi

            sleep "$DELAY"

            gh issue edit ${{ steps.role.outputs.issue }} --remove-label "agent:${{ steps.role.outputs.role }}"
            gh issue edit ${{ steps.role.outputs.issue }} --add-label "agent:${{ steps.role.outputs.role }}"
            exit 0
          fi

          # Subscription usage window exhausted mid-run. Observed twice,
          # with DIFFERENT death shapes:
          #   2026-08-24, run 32690743558 -- Claude Code died with no
          #   result object at all.
          #   2026-08-25, run 32848492633 -- same exhaustion, but a
          #   result object WAS emitted. The original condition here
          #   required "no result JSON", so the classifier skipped,
          #   every exhausted run fell through to a bare exit 1, the
          #   agent labels stayed on, and the hourly stall-recovery
          #   sweep re-triggered the same wall in bursts all night.
          # The rate-limit event with a closed overage path is the
          # tell on its own -- but ONLY when the event says the run was
          # actually blocked.
          #
          # CORRECTED 2026-09-01: match on rate_limit_info.STATUS, not on
          # the event's presence. Every run -- including every SUCCESSFUL
          # one -- carries `rateLimitType`, `overageStatus: rejected` and
          # `overageDisabledReason: out_of_credits`. Those describe the
          # account's OVERAGE CONFIGURATION (no extra-usage credits to
          # spill into), not this run's fate. Verified on successful run
          # 33522870930, which carries all three beside `"status":
          # "allowed"`. The old condition tested only those ambient
          # fields, so it was true in EVERY run: any failure reaching this
          # branch was reported as usage exhaustion, including two that
          # were really the self-hosted runner losing its network
          # connection. The client's own usage dashboard (4% weekly) is
          # what exposed it. A runner that loses communication never
          # reaches this step at all -- its real cause is the job's GitHub
          # annotation, which is where a dropout must be diagnosed.
          if echo "$RUN_LOG" | grep -A3 '"rate_limit_info"' | grep -qE '"status": *"(rejected|blocked|exhausted)"'; then
            RESETS_EPOCH="$(echo "$RUN_LOG" | grep -oE '"resetsAt": *[0-9]+' | head -1 | grep -oE '[0-9]+' || true)"
            RESETS_HUMAN="unknown"
            if [[ -n "$RESETS_EPOCH" ]]; then
              RESETS_HUMAN="$(date -u -d "@$RESETS_EPOCH" '+%Y-%m-%d %H:%M UTC' 2>/dev/null || echo "epoch $RESETS_EPOCH")"
            fi
            notify "$(cat <<EOF
          **This run stopped partway through — the account's Claude usage window is exhausted, and overage is unavailable.**

          The session started normally and then died with no result:
          the rate-limit event reported \`overageStatus: rejected\`
          (no extra-usage credits to spill into). Nothing is wrong with
          the code, the runner, or this issue's state.

          Usage window resets at: **$RESETS_HUMAN**.

          Retrying before then will fail the same way. Once past that
          time (or after adding credits at console.anthropic.com),
          remove status:needs-human and re-add
          agent:${{ steps.role.outputs.role }} to resume exactly where
          this left off.
          EOF
          )"
            exit 0
          fi

          IS_ERROR_LINE="$(echo "$RUN_LOG" | grep -o '"is_error":[[:space:]]*true' | head -1 || true)"
          COST_LINE="$(echo "$RUN_LOG" | grep -oE '"total_cost_usd":[[:space:]]*[0-9.]+' | head -1 || true)"
          TURNS_LINE="$(echo "$RUN_LOG" | grep -oE '"num_turns":[[:space:]]*[0-9]+' | head -1 || true)"

          if [[ -n "$IS_ERROR_LINE" ]]; then
            notify "$(cat <<EOF
          **This run failed partway through — Claude Code reported an error result, but not one this workflow recognizes specifically.**

          What's known from the run log: ${TURNS_LINE:-turn count unavailable}, ${COST_LINE:-cost unavailable}.

          A non-trivial cost alongside an error result usually means
          something failed partway through a real session rather than
          at the very start — worth checking whether this coincided
          with hitting a spending limit mid-run, which can surface
          differently than the upfront credit-balance error this
          workflow already catches.

          Check the full run log (Actions -> this run -> "Run Claude
          Code as ${{ steps.role.outputs.role }}") for the exact cause
          — this workflow can't pin it down automatically from here.

          Once resolved, remove status:needs-human and re-add
          agent:${{ steps.role.outputs.role }} to resume.
          EOF
          )"
            exit 0
          fi

          echo "Claude Code failed for a reason not in the known list, and no result JSON was found either — failing normally."
          exit 1

      # SELF-DRIVING RELAY (NAADAP fix, 2026-09-03). The pipeline used to
      # advance only when cron fired: a finished issue sat closed while
      # every dependent stayed status:on-hold until the next */10 sweep.
      # That makes GitHub's scheduled-event delivery a single point of
      # failure -- NAADAP measured a 2h37m outage of it, with the project
      # silently stopped the whole time and no error anywhere to notice.
      #
      # End of a relay run is the precise moment both sweeps have new
      # work: a dependency may have just closed, and any file lock this
      # run held has just been released. Dispatching them here makes
      # forward motion a consequence of the pipeline's own events; the
      # crons stay as a fail-safe for whatever the events miss.
      #
      # always(), so a failed or parked run still releases whatever it
      # legitimately unblocked -- and continue-on-error, because a failed
      # dispatch must never turn a successful agent run red. The crons
      # remain the backstop if this step is what fails.
      #
      # No runaway risk: dependency-check only re-triggers this workflow
      # if it actually RELEASES an issue, so the chain is bounded by the
      # number of issues and stops on the first sweep that frees nothing.
      - name: Kick the dependent sweeps
        if: always()
        continue-on-error: true
        run: |
          for WF in dependency-check.yml lock-retry.yml; do
            if gh workflow run "$WF" --repo "${{ github.repository }}"; then
              echo "dispatched $WF"
            else
              echo "WARNING: could not dispatch $WF -- the cron fail-safe still covers it."
            fi
          done
