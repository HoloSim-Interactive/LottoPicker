name: lock-retry

# Safety-net sweep, not the primary path. An agent that fails to
# acquire a lock backs off on its own (see docs/LOCKING.md) rather
# than idling inside a live job. This just makes sure a blocked issue
# doesn't sit forever if it's never otherwise re-triggered.
#
# NAADAP fix, 2026-09-03: agent-relay.yml now dispatches this at the end
# of every run, which is the moment a lock is actually released -- so a
# waiting issue is retried immediately rather than up to 10 minutes
# later. The cron below is demoted to a fail-safe; see the header of
# dependency-check.yml for why depending on GitHub's schedule delivery
# alone proved unsafe.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# cancel-in-progress: false (2026-09-04) -- this sweep has FOUR
# independent triggers (cron, issues:closed, every relay run's
# end-of-run dispatch, and manual/monitor nudges). Cancel-on-conflict
# would mean any two firing close together cancel each other before
# either completes -- confirmed live on a project built from this
# template: a console monitor re-nudging once per check cycle produced
# an unbroken chain of self-cancelled runs and the sweep never once
# finished. The sweep is idempotent and takes seconds, so queuing
# redundant triggers is the safe, cheap choice; cancelling them is not.
concurrency:
  group: lock-retry-sweep
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  requeue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
    steps:
      - name: Re-trigger issues waiting on a lock
        run: |
          gh issue list --label "status:waiting-on-lock" --state open \
            --json number,labels --repo "${{ github.repository }}" \
            | jq -c '.[]' \
            | while read -r issue; do
                NUMBER=$(echo "$issue" | jq -r '.number')
                AGENT_LABEL=$(echo "$issue" | jq -r '.labels[].name' | grep '^agent:' || true)
                if [[ -n "$AGENT_LABEL" ]]; then
                  echo "Re-triggering #$NUMBER ($AGENT_LABEL)"
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --remove-label "status:waiting-on-lock"
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --remove-label "$AGENT_LABEL"
                  gh issue edit "$NUMBER" --repo "${{ github.repository }}" \
                    --add-label "$AGENT_LABEL"
                fi
              done
